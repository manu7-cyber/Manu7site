<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मेरी पहली वेबसाइट</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff4e8;
      padding: 50px 15px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 15px #0002;
    }
    h1 { color: #a52a2a; }
    button {
      background: #a52a2a;
      color: white;
      border: 0;
      padding: 14px 30px;
      border-radius: 10px;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>नमस्ते! 🙏</h1>
    <p>यह मेरी पहली वेबसाइट है।</p>
    <button onclick="alert('वेबसाइट सफलतापूर्वक चल रही है!')">
      क्लिक करें
    </button>
  </div>
</body>
</html>
